baseURL = "/"
languageCode = "en-us"
title = "Urza's Oculus"
enableRobotsTXT = true
disableKinds = ["taxonomy", "term"]

[params]
  description = "A thoughtful, data-informed companion for Magic: The Gathering Arena drafts."
  tagline = "See the shape of the draft."
  githubURL = "https://github.com/sedward5/urzas-oculus"
  downloadURL = "https://github.com/sedward5/urzas-oculus/releases/latest/download/UrzasOculus.dmg"
  releasesURL = "https://github.com/sedward5/urzas-oculus/releases"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true


# Shared data source for the reviewed archetype catalog.
[[module.mounts]]
  source = "../scripts/data"
  target = "data"
