name: CodeQL

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detect:
    name: Detect CodeQL languages
    runs-on: ubuntu-latest
    outputs:
      swift: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.swift }}
      python: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.python }}
      actions: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.actions }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            swift:
              - 'Package.swift'
              - 'Sources/**'
              - 'Tests/**'
            python:
              - 'scripts/*.py'
            actions:
              - '.github/workflows/**'

  analyze-swift:
    name: CodeQL Swift
    needs: detect
    if: needs.detect.outputs.swift == 'true'
    runs-on: macos-15
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: swift
          queries: security-extended
          build-mode: manual
      - name: Build Swift targets for extraction
        run: swift build
      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:swift

  analyze-python:
    name: CodeQL Python
    needs: detect
    if: needs.detect.outputs.python == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: python
          queries: security-extended
          build-mode: none
      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:python

  analyze-actions:
    name: CodeQL GitHub Actions
    needs: detect
    if: needs.detect.outputs.actions == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: actions
          queries: security-extended
          build-mode: none
      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:actions
