name: Acquire Set Data (Recommended)
on:
  schedule:
    - cron: "23 11 * * 1"
  workflow_dispatch:
    inputs:
      set_code:
        description: Scryfall set code (for example TRK)
        required: false
        default: TRK
        type: string
      event_type:
        description: 17Lands event type
        required: true
        type: choice
        default: PremierDraft
        options: [PremierDraft, TradDraft, PickTwoDraft, Sealed, TradSealed]
      guide_url:
        description: Optional official Wizards guide URL
        required: false
        type: string
permissions:
  contents: write
  pull-requests: write
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m unittest scripts.test_set_catalog scripts.test_build_ops_inventory
      - name: Acquire source bundle
        env:
          SET_CODE: ${{ inputs.set_code || 'TRK' }}
          EVENT_TYPE: ${{ inputs.event_type || 'PremierDraft' }}
          GUIDE_URL: ${{ inputs.guide_url }}
        run: |
          ARGS=(acquire --set-code "$SET_CODE" --event-type "$EVENT_TYPE" --output set-acquisition-output)
          if [ -n "$GUIDE_URL" ]; then ARGS+=(--guide-url "$GUIDE_URL"); fi
          python3 scripts/set_catalog.py "${ARGS[@]}"
      - name: Stage permitted 17Lands public bulk archives
        env:
          SET_CODE: ${{ inputs.set_code || 'TRK' }}
          EVENT_TYPE: ${{ inputs.event_type || 'PremierDraft' }}
        run: |
          shopt -s nullglob
          DEST="website/static/data/17lands/${SET_CODE}/${EVENT_TYPE}"
          mkdir -p "$DEST"
          files=(set-acquisition-output/17lands/*.csv.gz)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No official 17Lands public bulk archives are available yet."
          else
            cp "${files[@]}" "$DEST/"
          fi
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          source = json.loads(Path("set-acquisition-output/manifest.json").read_text())
          event = source.get("17lands", {})
          destination = Path("website/static/data/17lands") / os.environ["SET_CODE"] / os.environ["EVENT_TYPE"] / "manifest.json"
          destination.parent.mkdir(parents=True, exist_ok=True)
          payload = {
              "schema_version": 1,
              "set_code": os.environ["SET_CODE"],
              "event_type": os.environ["EVENT_TYPE"],
              "generated_at": source.get("generated_at"),
              "archives": event.get("archives", {}),
              "probes": event.get("probes", {}),
          }
          destination.write_text(json.dumps(payload, indent=2) + "\n")
          PY
          if find website/static/data/17lands -type f -name 'card-data-all-time.json' -o -type f -name 'trophy-decks.json' | grep -q .; then
            echo "Restricted 17Lands API snapshots remain in the public tree."
            exit 1
          fi
      - name: Stage Scryfall and Wizards source evidence
        env:
          SET_CODE: ${{ inputs.set_code || 'TRK' }}
        run: |
          # Publish structured card metadata and extracted source evidence only.
          # Do not republish the full Wizards article HTML or downloaded images.
          mkdir -p "website/static/data/sets/${SET_CODE}/scryfall"
          mkdir -p "website/static/data/sets/${SET_CODE}/wizards"
          cp set-acquisition-output/scryfall/*.json "website/static/data/sets/${SET_CODE}/scryfall/"
          if [ -f set-acquisition-output/wizards/guide-evidence.json ]; then
            cp set-acquisition-output/wizards/guide-evidence.json "website/static/data/sets/${SET_CODE}/wizards/"
          fi
          cp set-acquisition-output/manifest.json "website/static/data/sets/${SET_CODE}/"
      - name: Rebuild ops inventory from the existing set catalog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          # Reuse the checked-in catalog snapshot. Acquisition must not trigger
          # a separate Scryfall/17Lands discovery pass.
          python3 - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          source = Path("website/static/data/ops/limited-sets.json")
          report = json.loads(source.read_text(encoding="utf-8"))
          report["generated_at"] = datetime.now(timezone.utc).isoformat()
          Path("/tmp/ops-inventory-input.json").write_text(
              json.dumps(report, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          PY
          python3 scripts/build_ops_inventory.py \
            --discovery /tmp/ops-inventory-input.json \
            --output website/static/data/ops/limited-sets.json
      - name: Create or update data publication pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          add-paths: |
            website/static/data/17lands/
            website/static/data/sets/${{ inputs.set_code || 'TRK' }}/
            website/static/data/ops/limited-sets.json
          branch: data/17lands-${{ inputs.set_code || 'TRK' }}-${{ inputs.event_type || 'PremierDraft' }}
          base: main
          delete-branch: false
          commit-message: "Publish ${{ inputs.set_code || 'TRK' }} source data and refresh ops inventory"
          title: "Publish ${{ inputs.set_code || 'TRK' }} set source data and refresh ops inventory"
          body: |
            Automated publication of permitted set source data, official 17Lands public bulk archives, and the refreshed operations inventory.

            - Scryfall card metadata and structured Wizards prerelease-guide evidence are included.
            - The ops inventory is rebuilt from the existing checked-in set catalog plus all acquisition artifacts on the workflow's main-branch checkout.
            - This does not run set discovery.
            - Full Wizards article HTML and downloaded images are not republished.
            - 17Lands API snapshots are never requested, retained, or published.

            - Set: ${{ inputs.set_code || 'TRK' }}
            - Event: ${{ inputs.event_type || 'PremierDraft' }}
            - Source acquisition run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            No 17Lands API snapshots are requested, retained, or published.
      - uses: actions/upload-artifact@v4
        with:
          name: set-acquisition-${{ inputs.set_code || 'TRK' }}-${{ github.run_id }}
          path: set-acquisition-output/
          if-no-files-found: error
          retention-days: 30
