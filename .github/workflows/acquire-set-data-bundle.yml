name: Acquire Set Data Bundle
on:
  schedule:
    - cron: "23 11 * * 1"
  workflow_dispatch:
    inputs:
      set_code:
        description: Scryfall set code (for example TRK)
        required: false
        default: TRK
        type: string
      event_type:
        description: 17Lands event type
        required: true
        type: choice
        default: PremierDraft
        options: [PremierDraft, TradDraft, PickTwoDraft, Sealed, TradSealed]
      guide_url:
        description: Optional official Wizards guide URL
        required: false
        type: string
permissions:
  contents: write
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m unittest scripts.test_set_catalog
      - name: Acquire source bundle
        env:
          SET_CODE: ${{ inputs.set_code || 'TRK' }}
          EVENT_TYPE: ${{ inputs.event_type || 'PremierDraft' }}
          GUIDE_URL: ${{ inputs.guide_url }}
        run: |
          ARGS=(acquire --set-code "$SET_CODE" --event-type "$EVENT_TYPE" --output set-acquisition-output)
          if [ -n "$GUIDE_URL" ]; then ARGS+=(--guide-url "$GUIDE_URL"); fi
          python3 scripts/set_catalog.py "${ARGS[@]}"
      - name: Publish GitHub-acquired 17Lands snapshots to the website feed
        env:
          SET_CODE: ${{ inputs.set_code || 'TRK' }}
          EVENT_TYPE: ${{ inputs.event_type || 'PremierDraft' }}
        run: |
          shopt -s nullglob
          DEST="website/static/data/17lands/${SET_CODE}/${EVENT_TYPE}"
          mkdir -p "$DEST"
          for file in set-acquisition-output/17lands/*.json; do
            cp "$file" "$DEST/"
          done
          if [ -n "$(git status --porcelain -- "$DEST")" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$DEST"
            git commit -m "Publish ${SET_CODE} ${EVENT_TYPE} 17Lands snapshots"
            git push
          else
            echo "No changed 17Lands snapshots to publish."
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: set-acquisition-${{ inputs.set_code || 'TRK' }}-${{ github.run_id }}
          path: set-acquisition-output/
          if-no-files-found: error
          retention-days: 30
