name: Acquire Set Data (Recommended)
on:
  schedule:
    - cron: "23 11 * * 1"
  workflow_dispatch:
    inputs:
      set_code:
        description: Scryfall set code (for example TRK)
        required: false
        default: TRK
        type: string
      event_type:
        description: 17Lands event type
        required: true
        type: choice
        default: PremierDraft
        options: [PremierDraft, TradDraft, PickTwoDraft, Sealed, TradSealed]
      guide_url:
        description: Optional official Wizards guide URL
        required: false
        type: string
permissions:
  contents: write
  pull-requests: write
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m unittest scripts.test_set_catalog
      - name: Acquire source bundle
        env:
          SET_CODE: ${{ inputs.set_code || 'TRK' }}
          EVENT_TYPE: ${{ inputs.event_type || 'PremierDraft' }}
          GUIDE_URL: ${{ inputs.guide_url }}
        run: |
          ARGS=(acquire --set-code "$SET_CODE" --event-type "$EVENT_TYPE" --output set-acquisition-output)
          if [ -n "$GUIDE_URL" ]; then ARGS+=(--guide-url "$GUIDE_URL"); fi
          python3 scripts/set_catalog.py "${ARGS[@]}"
      - name: Stage GitHub-acquired 17Lands snapshots
        env:
          SET_CODE: ${{ inputs.set_code || 'TRK' }}
          EVENT_TYPE: ${{ inputs.event_type || 'PremierDraft' }}
        run: |
          shopt -s nullglob
          DEST="website/static/data/17lands/${SET_CODE}/${EVENT_TYPE}"
          mkdir -p "$DEST"
          files=(set-acquisition-output/17lands/*.json)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No 17Lands JSON snapshots were produced; nothing to publish."
            exit 0
          fi
          cp "${files[@]}" "$DEST/"
      - name: Create or update data publication pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          add-paths: |
            website/static/data/17lands/${{ inputs.set_code || 'TRK' }}/${{ inputs.event_type || 'PremierDraft' }}/
          branch: data/17lands-${{ inputs.set_code || 'TRK' }}-${{ inputs.event_type || 'PremierDraft' }}
          base: main
          delete-branch: false
          commit-message: "Publish ${{ inputs.set_code || 'TRK' }} ${{ inputs.event_type || 'PremierDraft' }} 17Lands snapshots"
          title: "Publish ${{ inputs.set_code || 'TRK' }} ${{ inputs.event_type || 'PremierDraft' }} 17Lands snapshots"
          body: |
            Automated publication of the latest GitHub-acquired 17Lands JSON snapshots.

            - Set: ${{ inputs.set_code || 'TRK' }}
            - Event: ${{ inputs.event_type || 'PremierDraft' }}
            - Source acquisition run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Please review the snapshot provenance and source status before merging.
      - uses: actions/upload-artifact@v4
        with:
          name: set-acquisition-${{ inputs.set_code || 'TRK' }}-${{ github.run_id }}
          path: set-acquisition-output/
          if-no-files-found: error
          retention-days: 30
