name: 17Lands Archetype Performance Audit

on:
  workflow_dispatch:
    inputs:
      set_code:
        description: 17Lands expansion code
        required: true
        default: HOB
        type: string
      event_type:
        description: Event type
        required: true
        default: PremierDraft
        type: choice
        options:
          - PremierDraft
          - TradDraft
          - PickTwoDraft
          - Sealed
          - TradSealed

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Show Python version
        run: python3 --version
      - name: Run archetype audit unit tests
        run: python3 -m unittest scripts.test_analyze_17lands_archetypes
      - name: Run archetype performance audit
        run: |
          python3 scripts/analyze_17lands_archetypes.py \
            --set-code "${{ inputs.set_code }}" \
            --event-type "${{ inputs.event_type }}" \
            --output-dir archetype-output
      - name: Upload archetype report and summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 17lands-archetypes-${{ inputs.set_code }}-${{ inputs.event_type }}-${{ github.run_id }}
          path: archetype-output/
          if-no-files-found: warn
          retention-days: 30
