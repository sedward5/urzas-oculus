name: Optional - Discover Limited Sets (Read-only)
on:
  workflow_dispatch:
  schedule:
    - cron: "23 10 * * 1"
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m unittest scripts.test_set_catalog
      - run: python3 scripts/set_catalog.py discover --output set-discovery-output
      - uses: actions/upload-artifact@v4
        with:
          name: limited-set-discovery-${{ github.run_id }}
          path: set-discovery-output/
          if-no-files-found: error
          retention-days: 30
