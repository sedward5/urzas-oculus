name: macOS CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  detect-changes:
    name: Detect Swift changes
    runs-on: ubuntu-latest
    outputs:
      swift: ${{ steps.filter.outputs.swift }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Identify changes requiring macOS
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            swift:
              - 'Package.swift'
              - 'Sources/**'
              - 'Tests/**'
              - 'Resources/**'
              - 'scripts/**'
              - '.github/workflows/ci.yml'

  build-and-test:
    name: Build and test (macOS)
    needs: detect-changes
    if: needs.detect-changes.outputs.swift == 'true'
    runs-on: macos-15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Run tests
        run: swift test

      - name: Test independent archive validator
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Package application
        run: ./scripts/package-app.sh

      - name: Upload macOS application
        uses: actions/upload-artifact@v4
        with:
          name: UrzasOculus-macos
          path: dist/UrzasOculus-macos.zip
          if-no-files-found: error
          retention-days: 14
