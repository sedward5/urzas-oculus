name: macOS CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  detect-changes:
    name: Detect relevant changes
    runs-on: ubuntu-latest
    outputs:
      swift: ${{ steps.filter.outputs.swift }}
      python: ${{ steps.filter.outputs.python }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Identify validation scopes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            swift:
              - 'Package.swift'
              - 'Sources/**'
              - 'Tests/**'
              - 'Resources/**'
              - 'scripts/package-app.sh'
            python:
              - 'scripts/*.py'

  python-tests:
    name: Python script tests
    needs: detect-changes
    if: needs.detect-changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run script tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

  build-and-test:
    name: Build and test (macOS)
    needs: detect-changes
    if: needs.detect-changes.outputs.swift == 'true'
    runs-on: macos-15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Sync reviewed card catalog
        run: python3 scripts/sync_reviewed_card_catalog.py

      - name: Run tests
        run: swift test

      - name: Package application
        run: ./scripts/package-app.sh

      - name: Upload macOS application
        uses: actions/upload-artifact@v4
        with:
          name: UrzasOculus-macos
          path: dist/UrzasOculus-macos.zip
          if-no-files-found: error
          retention-days: 14
