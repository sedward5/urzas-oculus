name: macOS CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  detect-changes:
    name: Detect relevant changes
    runs-on: ubuntu-latest
    outputs:
      swift: ${{ steps.filter.outputs.swift }}
      python: ${{ steps.filter.outputs.python }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Identify validation scopes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            swift:
              - 'Package.swift'
              - 'Sources/**'
              - 'Tests/**'
              - 'Resources/**'
              - 'scripts/package-app.sh'
            python:
              - 'scripts/*.py'

  python-tests:
    name: Python script tests
    needs: detect-changes
    if: needs.detect-changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run script tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

  build-and-test:
    name: Build and test (macOS)
    needs: detect-changes
    if: needs.detect-changes.outputs.swift == 'true'
    runs-on: macos-15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Sync reviewed card catalog
        run: python3 scripts/sync_reviewed_card_catalog.py

      - name: Run tests
        run: swift test

      - name: Package application
        run: bash ./scripts/package-app.sh
        env:
          APP_VERSION: 0.1.${{ github.run_number }}

      - name: Verify distributable files
        run: |
          test -s dist/UrzasOculus-macos.zip
          test -s dist/UrzasOculus.dmg
          hdiutil verify dist/UrzasOculus.dmg
          plutil -lint dist/UrzasOculus.app/Contents/Info.plist
          codesign --verify --deep --strict dist/UrzasOculus.app
          mkdir -p "$RUNNER_TEMP/dmg-mount"
          hdiutil attach -readonly -nobrowse -mountpoint "$RUNNER_TEMP/dmg-mount" dist/UrzasOculus.dmg
          test -d "$RUNNER_TEMP/dmg-mount/UrzasOculus.app"
          test -L "$RUNNER_TEMP/dmg-mount/Applications"
          hdiutil detach "$RUNNER_TEMP/dmg-mount"

      - name: Capture UI review screenshots
        id: capture-ui-review
        if: success()
        run: bash scripts/capture-ui-review.sh dist/UrzasOculus.app screenshots/ui-review
      - name: Upload UI review screenshots
        if: always() && steps.capture-ui-review.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: UrzasOculus-UI-review-${{ github.run_number }}
          path: screenshots/ui-review/
          if-no-files-found: warn
          retention-days: 14
      - name: Add screenshot links to job summary
        if: always()
        run: |
          echo "## macOS UI Review Screenshots" >> "$GITHUB_STEP_SUMMARY"
          echo "Screenshots are attached as the **UrzasOculus-UI-review-${{ github.run_number }}** artifact (14-day retention)." >> "$GITHUB_STEP_SUMMARY"
      - name: Upload macOS application
        uses: actions/upload-artifact@v4
        with:
          name: UrzasOculus-macos
          path: |
            dist/UrzasOculus-macos.zip
            dist/UrzasOculus.dmg
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Publish GitHub release
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.build-and-test.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download packaged app
        uses: actions/download-artifact@v4
        with:
          name: UrzasOculus-macos
          path: dist

      - name: Create versioned GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          APP_VERSION: 0.1.${{ github.run_number }}
          TAG_NAME: build-${{ github.run_number }}-${{ github.sha }}
        run: |
          gh release create "$TAG_NAME" \
            dist/UrzasOculus.dmg \
            dist/UrzasOculus-macos.zip \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Urza's Oculus $APP_VERSION" \
            --notes "Automated macOS build from commit $GITHUB_SHA.

          **Install:** Open the DMG and drag Urza's Oculus into Applications.

          **Compatibility:** macOS 14 or later.

          **Security note:** This build is ad-hoc signed and is not yet Developer ID signed or notarized. macOS may display an unidentified-developer warning on first launch." \
            --latest
