name: Website CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'website/**'
      - 'scripts/generate_website_archetype_pages.py'
      - '.github/workflows/website-ci.yml'
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'scripts/generate_website_archetype_pages.py'
      - '.github/workflows/website-ci.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build Hugo site
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Hugo Extended
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.147.9'
          extended: true

      - name: Show Hugo version
        run: hugo version

      - name: Sync reviewed card catalog
        run: python3 scripts/sync_reviewed_card_catalog.py

      - name: Test set page generation
        run: python3 -m unittest scripts.test_generate_website_archetype_pages

      - name: Generate reviewed set pages
        run: python3 scripts/generate_website_archetype_pages.py

      - name: Build site
        working-directory: website
        run: hugo --minify --panicOnWarning --destination public
