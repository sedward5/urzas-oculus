name: 17Lands Replay Schema Audit

on:
  workflow_dispatch:
    inputs:
      set_code:
        description: 17Lands expansion code
        required: true
        default: HOB
        type: string
      event_type:
        description: Event type
        required: true
        default: PremierDraft
        type: choice
        options:
          - PremierDraft
          - TradDraft
          - PickTwoDraft
          - Sealed
          - TradSealed

permissions:
  contents: read

jobs:
  inspect:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show toolchain
        run: python3 --version

      - name: Download and inspect official archives
        run: |
          python3 scripts/inspect-17lands-replay.py \
            --set-code "${{ inputs.set_code }}" \
            --event-type "${{ inputs.event_type }}" \
            --output-dir replay-audit-output

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 17lands-replay-audit-${{ inputs.set_code }}-${{ inputs.event_type }}-${{ github.run_id }}
          path: replay-audit-output/
          if-no-files-found: warn
          retention-days: 30
